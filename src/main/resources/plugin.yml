name: CdrWaystone
version: ${version}
main: store.menkiestes.cdrwaystone.CdrWaystonePlugin
api-version: '1.21'
authors: [CADERA]
description: Native Waystone system for Vephilim with ItemsAdder visual skins.
softdepend: [ItemsAdder, Vault, CdrKnockout]
commands:
  cdrwaystone:
    description: Main CdrWaystone command
    aliases: [cws, cdrws]
    usage: /cws <info|category|access|trust|untrust|trusted|transfer|limit|skin|skins|admin|refresh|reload>
permissions:
  cdrwaystone.use:
    description: Allows using CdrWaystones and Waystone Keys
    default: true
  cdrwaystone.skin:
    description: Allows owners to change their Waystone skin
    default: true
  cdrwaystone.limit.bypass:
    description: Bypasses the Player Waystone ownership limit
    default: op
  cdrwaystone.cost.bypass:
    description: Bypasses all CdrWaystone travel costs
    default: op
  cdrwaystone.cooldown.bypass:
    description: Bypasses the Waystone travel cooldown
    default: op
  cdrwaystone.combat.bypass:
    description: Bypasses the Waystone combat travel lock
    default: op
  cdrwaystone.knockout.bypass:
    description: Bypasses CdrKnockout travel restrictions
    default: op
  cdrwaystone.admin:
    description: Administrative access to CdrWaystone and Admin Waystones
    default: op
