# CdrWaystone v0.6.4.4
# Paper 1.21.11 + Java 21

waystones:
  # Only players with cdrwaystone.create are converted into CdrWaystones.
  # Everyone else can place vanilla Lodestones normally.
  auto-register-lodestones: true
  default-name: "Waystone"

# Dedicated v0.6.4 defaults for Lodestones placed by staff.
# These keys are new, so existing v0.6.3 configs receive them automatically.
staff-placement:
  public: true
  free: false
  permanent: false
  always-active: true
  globally-discovered: true
  category: CITY

ownership:
  max-waystones-per-player: 3
  default-access: PRIVATE

categories:
  default-player: PLAYER
  default-admin: CITY

# Controls for Admin Waystones created/edited through admin commands.
admin-waystones:
  default-skin: divine
  default-public: true
  default-free: false
  default-permanent: false
  default-always-active: true
  default-globally-discovered: true

core:
  new-player-waystones: DORMANT
  new-admin-waystones: ACTIVE
  admin-bypass: true
  item-material: ECHO_SHARD
  recipe-enabled: true
  recipe:
    corner: AMETHYST_SHARD
    edge: ENDER_PEARL
    center: HEART_OF_THE_SEA

discovery:
  enabled: true
  radius: 8.0
  scan-interval-ticks: 20

network:
  enabled: true
  origin-radius: 6.5
  destinations-per-page: 45

economy:
  enabled: true
  provider: VAULT
  pricing:
    base-cost: 500.0
    cross-world-flat-cost: 5000.0
    minimum-cost: 0.0
    maximum-cost: 1000000.0
    rounding: CEIL
    distance:
      enabled: true
      free-distance: 0.0
      cost-per-1000-blocks: 500.0
    category-multipliers:
      CAPITAL: 1.0
      CITY: 1.0
      VILLAGE: 1.0
      DUNGEON: 1.0
      KINGDOM: 1.0
      PLAYER: 1.0
      EVENT: 1.0
      OTHER: 1.0
  xp:
    value-per-level: 250.0
  item:
    material: EMERALD
    display-name: Emerald
    value: 250.0

anti-abuse:
  cooldown:
    enabled: true
    seconds: 30
  combat:
    enabled: true
    tag-seconds: 15
    cancel-active-warp: true
  knockout:
    enabled: true
    block-knocked: true
    block-death-in-progress: true

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

# v0.6.4.4: solid laser display + rotating particle aura around the travelling player.
teleport-effects:
  enabled: true
  # Height of the laser column in blocks. Clamped to 2-32.
  beam-height: 7.0
  laser:
    enabled: true
    # Outer cyan shell and inner white core create a beacon-like laser.
    outer-width: 0.24
    inner-width: 0.085
    # Destination laser lifetime after arrival.
    arrival-duration-ticks: 24
  aura:
    # Thick rotating rings and helix follow the player during warmup.
    radius: 0.90
    ring-points: 22
    spiral-points: 14
    spark-count: 5
  density:
    # 1-3. Controls depart/arrival particle burst only.
    burst-multiplier: 2

power:
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

# Two invisible Barrier blocks are used as the interaction/collision anchor.
collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

# v0.6.4+ uses native ItemsAdder CustomFurniture.
visuals:
  enabled: true
  default-skin: andesite
  rotation-degrees: 0.0

key:
  material: COMPASS
  name: "<light_purple>Waystone Network Key</light_purple>"
  recipe-enabled: true
