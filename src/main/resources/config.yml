# CdrWaystone v0.6.2
# Paper 1.21.11 + Java 21

waystones:
  auto-register-lodestones: true
  default-name: "Waystone"

ownership:
  # Maximum Player Waystones owned by one player.
  # Permission cdrwaystone.limit.bypass ignores this limit.
  max-waystones-per-player: 3
  # PRIVATE, TRUSTED, PUBLIC
  default-access: PRIVATE

categories:
  # CAPITAL, CITY, VILLAGE, DUNGEON, KINGDOM, PLAYER, EVENT, OTHER
  default-player: PLAYER
  default-admin: CITY

admin-waystones:
  default-skin: divine
  default-public: true
  default-free: true
  default-permanent: true
  default-always-active: true
  default-globally-discovered: true

# Waystone Core & Activation Progression
core:
  # New Player Waystones start DORMANT and require a Waystone Core.
  # Existing pre-v0.6.0 Waystones migrate as ACTIVE automatically.
  new-player-waystones: DORMANT
  new-admin-waystones: ACTIVE
  # Server Admin Waystones can operate without a Core when enabled.
  admin-bypass: true

  # PDC-authenticated custom Core item.
  item-material: ECHO_SHARD
  recipe-enabled: true
  recipe:
    # Recipe shape:
    # A E A
    # E H E
    # A E A
    corner: AMETHYST_SHARD
    edge: ENDER_PEARL
    center: HEART_OF_THE_SEA

discovery:
  enabled: true
  radius: 8.0
  scan-interval-ticks: 20

# Travel is strictly Waystone -> Waystone.
# The player must remain close to the origin Waystone until the countdown ends.
network:
  enabled: true
  origin-radius: 6.5
  destinations-per-page: 28

# Travel Cost & Economy Engine
# Default production mode uses Vault money.
# Optional compatible providers remain available: AUTO, VAULT, XP_LEVELS, ITEM, NONE.
economy:
  enabled: true
  provider: VAULT

  pricing:
    # Every paid route starts with this amount.
    base-cost: 500.0
    # Cross-world travel adds this flat amount instead of distance pricing.
    cross-world-flat-cost: 5000.0
    minimum-cost: 0.0
    maximum-cost: 1000000.0
    # CEIL, FLOOR, ROUND, NONE
    rounding: CEIL

    distance:
      enabled: true
      # Same-world travel is billed from the origin Waystone to the destination Waystone.
      free-distance: 0.0
      cost-per-1000-blocks: 500.0

    # Optional destination-category price multipliers.
    category-multipliers:
      CAPITAL: 1.0
      CITY: 1.0
      VILLAGE: 1.0
      DUNGEON: 1.0
      KINGDOM: 1.0
      PLAYER: 1.0
      EVENT: 1.0
      OTHER: 1.0

  # Compatibility settings if XP_LEVELS or AUTO is selected manually.
  xp:
    value-per-level: 250.0

  # Compatibility settings if ITEM is selected manually.
  item:
    material: EMERALD
    display-name: Emerald
    value: 250.0

# Cooldown & Anti-Abuse Engine
anti-abuse:
  cooldown:
    enabled: true
    # Starts only after a successful Waystone-to-Waystone teleport.
    seconds: 30

  combat:
    enabled: true
    # Both PvP attacker and victim are tagged.
    tag-seconds: 15
    # Immediately cancels an active Waystone warmup when PvP starts.
    cancel-active-warp: true

  knockout:
    enabled: true
    # Uses the public CdrKnockout Bukkit service when that plugin is installed.
    # CdrWaystone still works normally without CdrKnockout.
    block-knocked: true
    block-death-in-progress: true

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

power:
  # NONE, INTER_DIMENSION, ALL
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

gui:
  enabled: true

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

visuals:
  enabled: true
  default-skin: andesite
  y-offset: 0.0
  rotation-degrees: 0.0
  view-range: 1.5

key:
  material: COMPASS
  name: "<light_purple>Waystone Network Key</light_purple>"
  recipe-enabled: true
