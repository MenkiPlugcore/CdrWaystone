# CdrWaystone v0.6.1
# Paper 1.21.11 + Java 21

waystones:
  auto-register-lodestones: true
  default-name: "Waystone"

ownership:
  # Maximum Player Waystones owned by one player.
  # Permission cdrwaystone.limit.bypass ignores this limit.
  max-waystones-per-player: 3
  # PRIVATE, TRUSTED, PUBLIC
  default-access: PRIVATE

categories:
  # CAPITAL, CITY, VILLAGE, DUNGEON, KINGDOM, PLAYER, EVENT, OTHER
  default-player: PLAYER
  default-admin: CITY

admin-waystones:
  default-skin: divine
  default-public: true
  default-free: true
  default-permanent: true
  default-always-active: true
  default-globally-discovered: true

# Waystone Core & Activation Progression
core:
  # New Player Waystones start DORMANT and require a Waystone Core.
  # Existing pre-v0.6.0 Waystones migrate as ACTIVE automatically.
  new-player-waystones: DORMANT
  new-admin-waystones: ACTIVE
  # When enabled, Admin Waystones operate as ACTIVE infrastructure even if their stored state is Dormant.
  admin-bypass: true

  # The PDC-authenticated custom Core item.
  item-material: ECHO_SHARD
  recipe-enabled: true
  recipe:
    # Recipe shape:
    # A E A
    # E H E
    # A E A
    corner: AMETHYST_SHARD
    edge: ENDER_PEARL
    center: HEART_OF_THE_SEA

# Waystone Tier & Upgrade Progression
# DORMANT is the Core state before tiers begin.
# Active tiers: AWAKENED -> EMPOWERED -> ANCIENT -> ASCENDED
tier:
  enabled: true
  default-player: AWAKENED
  default-admin: ASCENDED
  # Admin infrastructure behaves as ASCENDED when enabled.
  admin-bypass: true

  perks:
    AWAKENED:
      max-distance: 2000.0
      cross-world: false
      cost-multiplier: 1.25
      cooldown-multiplier: 1.25
    EMPOWERED:
      max-distance: 5000.0
      cross-world: false
      cost-multiplier: 1.0
      cooldown-multiplier: 1.0
    ANCIENT:
      # 0 = unlimited same-world range
      max-distance: 0.0
      cross-world: true
      cost-multiplier: 0.85
      cooldown-multiplier: 0.75
    ASCENDED:
      max-distance: 0.0
      cross-world: true
      cost-multiplier: 0.65
      cooldown-multiplier: 0.50

  upgrades:
    EMPOWERED:
      xp-levels: 10
      items:
        AMETHYST_SHARD: 16
        ENDER_PEARL: 4
    ANCIENT:
      xp-levels: 20
      items:
        ECHO_SHARD: 8
        HEART_OF_THE_SEA: 2
    ASCENDED:
      xp-levels: 30
      items:
        NETHER_STAR: 1
        ECHO_SHARD: 16
        AMETHYST_SHARD: 16

discovery:
  enabled: true
  radius: 8.0
  scan-interval-ticks: 20

network:
  enabled: true
  origin-radius: 6.5
  destinations-per-page: 28

# Travel Cost & Economy Engine
# Providers: AUTO, VAULT, XP_LEVELS, ITEM, NONE
# AUTO uses Vault when an economy provider exists, otherwise XP_LEVELS.
economy:
  enabled: true
  provider: AUTO

  pricing:
    base-cost: 0.0
    # Added for cross-world travel instead of normal distance pricing.
    cross-world-flat-cost: 1000.0
    minimum-cost: 0.0
    maximum-cost: 1000000.0
    # CEIL, FLOOR, ROUND, NONE
    rounding: CEIL

    distance:
      enabled: true
      free-distance: 500.0
      cost-per-1000-blocks: 250.0

    # Applied to the destination category before tier multipliers.
    category-multipliers:
      CAPITAL: 1.0
      CITY: 1.0
      VILLAGE: 1.0
      DUNGEON: 1.0
      KINGDOM: 1.0
      PLAYER: 1.0
      EVENT: 1.0
      OTHER: 1.0

  # Used when provider is XP_LEVELS or AUTO falls back to XP_LEVELS.
  xp:
    value-per-level: 250.0

  # Used when provider is ITEM.
  item:
    material: EMERALD
    display-name: Emerald
    value: 250.0

# Cooldown & Anti-Abuse Engine
anti-abuse:
  cooldown:
    enabled: true
    # Starts only after a successful Waystone teleport.
    # Final cooldown is multiplied by the route Waystone tier.
    seconds: 30

  combat:
    enabled: true
    # Both PvP attacker and victim are tagged.
    tag-seconds: 15
    # Immediately cancels an active Waystone warmup when PvP starts.
    cancel-active-warp: true

  knockout:
    enabled: true
    # Uses the public CdrKnockout Bukkit service when that plugin is installed.
    # CdrWaystone still works normally without CdrKnockout.
    block-knocked: true
    block-death-in-progress: true

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

power:
  # NONE, INTER_DIMENSION, ALL
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

gui:
  enabled: true

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

visuals:
  enabled: true
  default-skin: andesite
  y-offset: 0.0
  rotation-degrees: 0.0
  view-range: 1.5

key:
  material: COMPASS
  name: "<light_purple>Waystone Key</light_purple>"
  relinkable: true
  recipe-enabled: true
