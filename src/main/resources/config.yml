# CdrWaystone v0.6.3
# Paper 1.21.11 + Java 21

waystones:
  auto-register-lodestones: true
  default-name: "Waystone"

ownership:
  max-waystones-per-player: 3
  default-access: PRIVATE

categories:
  default-player: PLAYER
  default-admin: CITY

admin-waystones:
  default-skin: divine
  default-public: true
  default-free: true
  default-permanent: true
  default-always-active: true
  default-globally-discovered: true

core:
  new-player-waystones: DORMANT
  new-admin-waystones: ACTIVE
  admin-bypass: true
  item-material: ECHO_SHARD
  recipe-enabled: true
  recipe:
    corner: AMETHYST_SHARD
    edge: ENDER_PEARL
    center: HEART_OF_THE_SEA

discovery:
  enabled: true
  radius: 8.0
  scan-interval-ticks: 20

# Travel is strictly Waystone -> Waystone.
network:
  enabled: true
  origin-radius: 6.5
  # v0.6.3 GUI uses the first five rows for destinations.
  destinations-per-page: 45

economy:
  enabled: true
  provider: VAULT
  pricing:
    base-cost: 500.0
    cross-world-flat-cost: 5000.0
    minimum-cost: 0.0
    maximum-cost: 1000000.0
    rounding: CEIL
    distance:
      enabled: true
      free-distance: 0.0
      cost-per-1000-blocks: 500.0
    category-multipliers:
      CAPITAL: 1.0
      CITY: 1.0
      VILLAGE: 1.0
      DUNGEON: 1.0
      KINGDOM: 1.0
      PLAYER: 1.0
      EVENT: 1.0
      OTHER: 1.0
  xp:
    value-per-level: 250.0
  item:
    material: EMERALD
    display-name: Emerald
    value: 250.0

anti-abuse:
  cooldown:
    enabled: true
    seconds: 30
  combat:
    enabled: true
    tag-seconds: 15
    cancel-active-warp: true
  knockout:
    enabled: true
    block-knocked: true
    block-death-in-progress: true

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

# Beacon-like charging and arrival visuals.
teleport-effects:
  enabled: true
  beam-height: 5.0
  ring-radius: 1.15

power:
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

# ItemsAdder Waystone model presentation.
visuals:
  enabled: true
  default-skin: andesite
  # FIXED is the correct static item-display context for the Vephilim Waystone models.
  display-transform: FIXED
  model-y-offset: 0.5
  scale: 1.0
  rotation-degrees: 0.0
  view-range: 1.5

key:
  material: COMPASS
  name: "<light_purple>Waystone Network Key</light_purple>"
  recipe-enabled: true
