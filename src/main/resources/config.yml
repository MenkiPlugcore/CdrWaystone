# CdrWaystone v0.3.1
# Paper 1.21.11 + Java 21

waystones:
  auto-register-lodestones: true
  default-name: "Waystone"

ownership:
  # Maximum Player Waystones owned by one player.
  # Permission cdrwaystone.limit.bypass ignores this limit.
  max-waystones-per-player: 3
  # PRIVATE, TRUSTED, PUBLIC
  default-access: PRIVATE

admin-waystones:
  default-skin: divine
  default-public: true
  default-free: true
  default-permanent: true
  default-always-active: true
  # Makes new Admin Waystones appear as DISCOVERED to every player.
  # Players still activate them individually before travel.
  default-globally-discovered: true

discovery:
  enabled: true
  # First-time discovery radius around a Waystone, in blocks.
  radius: 8.0
  # 20 ticks = 1 second. Minimum runtime value is 20 ticks.
  scan-interval-ticks: 20

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

power:
  # NONE, INTER_DIMENSION, ALL
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

gui:
  enabled: true

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

visuals:
  enabled: true
  default-skin: andesite
  y-offset: 0.0
  rotation-degrees: 0.0
  view-range: 1.5

key:
  material: COMPASS
  name: "<light_purple>Waystone Key</light_purple>"
  relinkable: true
  recipe-enabled: true
