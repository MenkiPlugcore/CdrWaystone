# CdrWaystone v0.6.5.1
# Paper 1.21.11 + Java 21

waystones:
  # Only players with cdrwaystone.create are converted into CdrWaystones.
  # Everyone else can place vanilla Lodestones normally.
  auto-register-lodestones: true
  default-name: "Waystone"

# Dedicated defaults for Lodestones placed by staff.
staff-placement:
  public: true
  free: false
  permanent: false
  always-active: true
  globally-discovered: true
  category: CITY

ownership:
  max-waystones-per-player: 3
  default-access: PRIVATE

categories:
  default-player: PLAYER
  default-admin: CITY

# Controls for Admin Waystones created/edited through admin commands.
admin-waystones:
  default-skin: divine
  default-public: true
  default-free: false
  default-permanent: false
  default-always-active: true
  default-globally-discovered: true

core:
  new-player-waystones: DORMANT
  new-admin-waystones: ACTIVE
  admin-bypass: true
  item-material: ECHO_SHARD
  recipe-enabled: true
  recipe:
    corner: AMETHYST_SHARD
    edge: ENDER_PEARL
    center: HEART_OF_THE_SEA

discovery:
  enabled: true
  radius: 8.0
  scan-interval-ticks: 20

# Global Cross-World Network.
network:
  enabled: true
  global-network: true
  origin-radius: 6.5
  destinations-per-page: 45
  cross-world:
    enabled: true
    official-waystones-auto-unlocked: true
    show-world-name: true

economy:
  enabled: true
  provider: VAULT
  pricing:
    base-cost: 500.0
    cross-world-flat-cost: 5000.0
    minimum-cost: 0.0
    maximum-cost: 1000000.0
    rounding: CEIL
    distance:
      enabled: true
      free-distance: 0.0
      cost-per-1000-blocks: 500.0
    category-multipliers:
      CAPITAL: 1.0
      CITY: 1.0
      VILLAGE: 1.0
      DUNGEON: 1.0
      KINGDOM: 1.0
      PLAYER: 1.0
      EVENT: 1.0
      OTHER: 1.0
  xp:
    value-per-level: 250.0
  item:
    material: EMERALD
    display-name: Emerald
    value: 250.0

anti-abuse:
  cooldown:
    enabled: true
    seconds: 30
  combat:
    enabled: true
    tag-seconds: 15
    cancel-active-warp: true
  knockout:
    enabled: true
    block-knocked: true
    block-death-in-progress: true

warp:
  delay-seconds: 5
  damage-cancels: true
  movement-cancels: false
  allow-cross-world: true
  safe-radius: 3

# v0.6.5.1: slim rotating Waystone laser + expanding player spiral.
teleport-effects:
  enabled: true
  beam-height: 6.0
  laser:
    enabled: true
    # Small static center core. Kept thin so the Waystone model stays visible.
    core-width: 0.060
    # Width of each rotating laser strand.
    strand-width: 0.050
    # Number of spiral strands and vertical segments used to form them.
    strands: 2
    segments: 6
    # Strand radius expands from min-radius at the base to max-radius above.
    min-radius: 0.10
    max-radius: 0.34
    # Number of helix turns over the full beam height.
    turns: 1.65
    # Rotation speed per animation step.
    rotation-speed: 0.22
    arrival-duration-ticks: 24
  aura:
    # Player spiral starts tight at the feet and opens toward the head.
    min-radius: 0.16
    max-radius: 0.72
    ring-points: 14
    spiral-points: 14
    spark-count: 2
  density:
    # Kept modest so the player skin remains visible.
    burst-multiplier: 1

power:
  require: INTER_DIMENSION
  respawn-anchor-cost: 1

suppression:
  enabled: true
  block: OBSIDIAN

collision:
  enabled: true

protection:
  explosions: true
  pistons: true

stability:
  health-check-seconds: 300

portal-sickness:
  enabled: true
  chance: 0.05
  nausea-seconds: 15
  blindness-seconds: 3
  damage: 5.0

visuals:
  enabled: true
  default-skin: andesite
  rotation-degrees: 0.0

key:
  material: COMPASS
  name: "<light_purple>Waystone Network Key</light_purple>"
  recipe-enabled: true
